name: Generate Voice Files

on:
  push:
    branches: [main]
    paths:
      - 'course_data.json'
      - 'generate_voices.py'
      - '.github/workflows/generate-voices.yml'
  workflow_dispatch:
    inputs:
      regenerate_all:
        description: 'Regenerate ALL files?'
        required: false
        type: boolean
        default: false
      language:
        description: 'Language'
        required: false
        type: choice
        default: 'en'
        options:
          - 'en'
          - 'ar'
          - 'both'

permissions:
  contents: write

jobs:
  generate-voices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Clean audio (if regenerate_all)
        if: ${{ inputs.regenerate_all == true }}
        run: rm -rf audio/*.mp3 || true

      - name: Generate voices
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          GENERATE_LANGUAGE: ${{ inputs.language || 'en' }}
        run: |
          if [ -z "$ELEVEN_API_KEY" ]; then
            echo "ERROR: ELEVEN_API_KEY secret is not set"
            exit 1
          fi
          python generate_voices.py

      - name: Commit audio files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-generate voice files"
          git push
